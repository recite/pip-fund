[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "pip-fund"
version = "0.2.1"
description = "Find funding links for installed Python packages and their dependencies"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gaurav Sood", email = "contact@gsood.com" }
]
maintainers = [
    { name = "Gaurav Sood", email = "contact@gsood.com" }
]
keywords = [
    "funding",
    "sponsorship",
    "open-source",
    "packaging",
    "pypi",
    "donations",
    "npm-fund"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Software Distribution",
    "Topic :: Utilities"
]

dependencies = [
    "packaging>=25.0",
    "requests>=2.32",
]

[project.urls]
Homepage = "https://github.com/recite/pip-fund"
Repository = "https://github.com/recite/pip-fund.git"
Documentation = "https://github.com/recite/pip-fund#readme"
"Bug Tracker" = "https://github.com/recite/pip-fund/issues"
Funding = "https://github.com/sponsors/soodoku"

[project.scripts]
pip-fund = "pip_fund.cli:cli"

[project.optional-dependencies]
github = [
    "PyYAML>=6.0"
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pre-commit>=4",
    "types-PyYAML>=6.0",
    "types-requests>=2.33.0.20261006",
    "twine>=7.0",
    "pyright>=1.1.390",
    "pydoclint>=0.11.0",
    { include-group = "test" },
]
test = [
    "pytest>=8",
    "pytest-cov>=6",
    "PyYAML>=6.0",
]
docs = ["sphinx>=8", "furo", "myst-parser", "sphinx-copybutton", "py-canon @ git+https://github.com/gojiplus/py-canon@v1"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["pip_fund"]

[tool.pytest.ini_options]
minversion = "8"
log_level = "INFO"
xfail_strict = true
filterwarnings = ["error"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-config --strict-markers --cov=pip_fund --cov-report=term-missing --cov-fail-under=90"

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.12" }

[tool.uv.build-backend]
module-name = "pip_fund"

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"

[tool.preen]
# Synthetic endpoints exercised by offline discovery tests.
link_ignore = [
    '^https?://github\.com/acme/demo(?:\.git|/issues)?$',
    '^https?://pypi\.org/pypi/demo/1\.0/json$',
    '^https?://crowdfunding\.lfx\.linuxfoundation\.org/projects/linux$',
]
